<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram 媒体批量下载</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131a2b;--line:#29344b;--text:#eef2ff;--muted:#a4afc6;--accent:#b8c5ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c2440 0,#0b1020 55%);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
main{width:min(100%,620px)}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}.panel{margin-top:16px;padding:clamp(22px,5vw,38px);background:rgba(19,26,43,.94);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 80px #0005}h1{font-size:clamp(27px,5vw,38px);line-height:1.2;margin:8px 0 12px;letter-spacing:-.04em}p{color:var(--muted);margin:0 0 22px}.label{display:block;font-size:14px;font-weight:650;margin:20px 0 8px}input[type=text],input[type=file]{width:100%;padding:14px 15px;border:1px solid #35415a;border-radius:12px;background:#0d1424;color:var(--text);font:inherit}input[type=file]{font-size:13px}.hint{font-size:12px;color:var(--muted);margin-top:7px}button,.download{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;background:var(--accent);color:#10162a;font:700 15px system-ui;padding:14px 18px;margin-top:24px;cursor:pointer;text-decoration:none}button:disabled{opacity:.55;cursor:wait}.note{margin-top:22px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted)}.status{margin-top:18px;padding:14px;border-radius:12px;background:#0d1424;font-size:14px;display:none;overflow-wrap:anywhere}.status.error{border:1px solid #814c59;color:#ffc2cb}.status.success{border:1px solid #426c60;color:#b6f1d8}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #77809a;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;font-size:11px;color:#78849c;margin-top:18px}
</style>
</head>
<body><main>
<div class="brand">MEDIA TOOL / 01</div>
<section class="panel">
<h1>Instagram 媒体批量下载</h1>
<p>输入博主主页，一次性收集可访问的图片与视频，并打包成 ZIP 文件。</p>
<form id="form">
<label class="label" for="profile">博主用户名或主页链接</label>
<input id="profile" name="profile" type="text" placeholder="例如 username 或 instagram.com/username/" required autocomplete="url">
<label class="label" for="cookies">登录 Cookie（可选）</label>
<input id="cookies" name="cookies" type="file" accept=".txt,text/plain">
<div class="hint">若 Instagram 要求登录，可选择从自己的浏览器导出的 Netscape 格式 cookies.txt。Cookie 文件只在本机处理，任务开始后会删除。</div>
<button id="submit" type="submit">开始批量下载 <span aria-hidden="true">↗</span></button>
</form>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div class="note">仅用于你有权保存的内容。此工具在你的电脑本地运行，不会把媒体上传到第三方服务器。Instagram 可能因登录验证、私密账号、频率限制或页面结构变化而拒绝访问；无法保证每个账号都能完整下载。</div>
</section>
<footer>本地运行 · 文件直接打包下载 · 不托管账号密码</footer>
</main>
<script>
const form=document.getElementById('form'),btn=document.getElementById('submit'),statusBox=document.getElementById('status');
function show(message,kind=''){statusBox.style.display='block';statusBox.className='status '+kind;statusBox.textContent=message;}
form.addEventListener('submit',async e=>{
 e.preventDefault();btn.disabled=true;btn.innerHTML='<span class="spinner"></span> 正在创建任务…';show('正在启动下载任务，请勿关闭此页面。');
 try{
  const data=new FormData(form);const r=await fetch('/api/download',{method:'POST',body:data});const j=await r.json();if(!r.ok)throw new Error(j.error||'无法启动任务');
  const id=j.job_id;
  const poll=async()=>{const sr=await fetch('/api/status/'+id);const s=await sr.json();if(!sr.ok)throw new Error(s.error||'无法读取任务状态');
   if(s.status==='running'){show(s.message+'\n页面会自动检查进度。');setTimeout(()=>poll().catch(err=>{show(err.message,'error');btn.disabled=false;btn.textContent='重新开始下载';}),1800);}
   else if(s.status==='done'){show(s.message,'success');const a=document.createElement('a');a.className='download';a.href=s.download_url;a.textContent='下载 ZIP 压缩包';statusBox.appendChild(document.createElement('br'));statusBox.appendChild(a);btn.disabled=false;btn.textContent='开始新的下载';}
   else{show(s.message||'下载失败。','error');btn.disabled=false;btn.textContent='重新开始下载';}
  };await poll();
 }catch(err){show(err.message,'error');btn.disabled=false;btn.textContent='重新开始下载';}
});
</script></body></html>
